<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arrel">
<meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Arrel</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3eee5;--card:#fbf8f2;--card2:#f6f1e8;--ink:#2e2a24;--ink2:#5f574c;--muted:#958b7d;--line:#e4dccd;
  --sage:#7f9471;--sage-soft:#e2e8da;--moss:#5e7550;--terra:#b9643f;--terra-soft:#f2e1d6;--sand:#cdb68a;--plum:#8c7a9b;
  --m1:#b5654a;--m2:#d39a72;--m3:#cdb68a;--m4:#9aab84;--m5:#6f8a5e;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1c1a17;--card:#24211d;--card2:#2a2621;--ink:#efe8dc;--ink2:#c9bfb0;--muted:#8f8577;--line:#38332c;
  --sage:#9fb28f;--sage-soft:#2b3226;--moss:#a9c095;--terra:#d98060;--terra-soft:#3c2a22;--sand:#a8916a;--plum:#ab98bd;
  --m1:#c97659;--m2:#d9a27c;--m3:#bfa77a;--m4:#9fb28f;--m5:#86a675;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1a17;--card:#24211d;--card2:#2a2621;--ink:#efe8dc;--ink2:#c9bfb0;--muted:#8f8577;--line:#38332c;
  --sage:#9fb28f;--sage-soft:#2b3226;--moss:#a9c095;--terra:#d98060;--terra-soft:#3c2a22;--sand:#a8916a;--plum:#ab98bd;
  --m1:#c97659;--m2:#d9a27c;--m3:#bfa77a;--m4:#9fb28f;--m5:#86a675;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px;font-family:inherit;font-weight:650;letter-spacing:0}
.muted{color:var(--muted);font-size:13px}
.sub{color:var(--ink2);font-size:14px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card>h3{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--terra);border-color:var(--terra)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;color:var(--ink2);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.terra.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip.sage.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;font-weight:600}
.lbl:first-child{margin-top:0}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left))}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0 14px}
.hello{color:var(--muted);font-size:14px;margin-bottom:2px}
.datenav{display:flex;gap:6px;align-items:center}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{border:0;background:transparent;border-radius:16px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2)}
.wd .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.wd .n{font-size:15px;font-weight:600;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;position:relative}
.wd.sel{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.wd.today .n{color:var(--terra)}
.wd .pd{width:5px;height:5px;border-radius:50%;background:transparent}
.wd .pd.on{background:var(--terra)}
.ring{position:absolute;inset:0}
/* cycle chip */
.cyc{display:flex;align-items:center;gap:14px;cursor:pointer}
.cyc .big{font-family:var(--serif);font-size:30px;line-height:1;font-weight:600;color:var(--terra);min-width:48px;text-align:center}
.cyc .big small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.phase-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* habits */
.hrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0;padding-top:2px}
.hrow .em{font-size:20px;width:28px;text-align:center;flex:none}
.hrow .hn{flex:1;min-width:0;cursor:pointer}
.hrow .hn b{font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hn small{color:var(--muted);font-size:12px;display:block}
.hrow.done .hn b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;font-size:16px;flex:none;transition:all .15s}
.chk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.ctr{display:flex;align-items:center;gap:6px;flex:none}
.ctr button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:16px;line-height:1}
.ctr span{min-width:42px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.ctr.full span{color:var(--sage)}
.lnk{color:var(--muted);text-decoration:none;font-size:15px;padding:4px}
.hprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.hprog i{display:block;height:100%;background:var(--sage);border-radius:3px}
/* mood */
.faces{display:flex;justify-content:space-between;gap:4px}
.face{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:14px;flex:1;color:var(--muted);font-size:11px}
.face svg{width:40px;height:40px}
.face.on{background:var(--card2);color:var(--ink)}
.face:not(.on) svg{opacity:.55}
.lvl{display:flex;gap:6px}
.lvl button{flex:1;height:30px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:12px;color:var(--muted)}
.lvl button.on{background:var(--sand);border-color:var(--sand);color:#2e2a24}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.flow button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.flow button.on{border-color:var(--terra);background:var(--terra-soft);color:var(--ink)}
.drops{display:flex;gap:2px;height:14px;align-items:flex-end}
.drops i{width:6px;border-radius:3px 3px 3px 3px;background:var(--terra)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:18px}
.stepper b{min-width:64px;text-align:center;font-size:18px;font-family:var(--serif)}
textarea,input[type=text],input[type=number],input[type=date],input[type=url],select{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 12px;font-size:16px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--sage)}
textarea{resize:vertical;min-height:70px}
details summary{cursor:pointer;color:var(--ink2);font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:12px}
details[open] summary::before{content:"−"}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wl{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase}
.cd{aspect-ratio:1/1.12;border:0;background:transparent;border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 0;font-size:14px;color:var(--ink)}
.cd.out{opacity:.3}
.cd .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:550;position:relative;z-index:1}
.cd.fert{background:var(--sage-soft)}
.cd.per .num{background:var(--terra);color:#fff}
.cd.pred .num{box-shadow:inset 0 0 0 1.5px var(--terra);border:0;background-image:none;outline:1.5px dashed var(--terra);outline-offset:-1.5px;box-shadow:none}
.cd.ovu .num{box-shadow:inset 0 0 0 1.5px var(--sage)}
.cd.spot .sp{position:absolute;top:5px;right:calc(50% - 19px);width:6px;height:6px;border-radius:50%;background:var(--terra)}
.cd.win{background:var(--terra-soft)}
.cd.today{background:var(--card);box-shadow:0 0 0 1.5px var(--ink) inset}
.cd .md{width:7px;height:7px;border-radius:50%;margin-top:3px}
.cd .hb{width:62%;height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.cd .hb i{display:block;height:100%;background:var(--moss)}
.cd .hx{font-size:10px;color:var(--moss);margin-top:1px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
/* cycle */
.ringwrap{display:flex;justify-content:center;margin:2px 0 6px}
.ringwrap svg{width:240px;height:240px;max-width:100%}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--ink2)}
.ph p{margin:6px 0;font-size:14px;color:var(--ink2)}
.ph p b{color:var(--ink);font-weight:600}
.note{background:var(--card2);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:-apple-system,system-ui,sans-serif}
/* insights */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .t{background:var(--card2);border-radius:14px;padding:10px}
.stat .t b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.stat .t span{font-size:11.5px;color:var(--muted)}
.hstat{padding:9px 0;border-top:1px solid var(--line)}
.hstat:first-of-type{border-top:0}
.dots{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:6px}
.dots i{aspect-ratio:1;border-radius:2px;background:var(--line)}
.dots i.y{background:var(--sage)}
.dots i.n{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.bars .br{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bars .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:5px}
.bars .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.pix{display:grid;grid-template-columns:20px repeat(31,minmax(0,1fr));gap:2px;font-size:9px;color:var(--muted)}
.pix span{min-width:0;white-space:nowrap}
.pix i{aspect-ratio:1;border-radius:2px;background:var(--line);opacity:.55}
.pix i.x{background:transparent;opacity:1}
.pix i.m1{background:var(--m1);opacity:1}.pix i.m2{background:var(--m2);opacity:1}.pix i.m3{background:var(--m3);opacity:1}.pix i.m4{background:var(--m4);opacity:1}.pix i.m5{background:var(--m5);opacity:1}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.set:first-of-type{border-top:0}
.set select,.set input[type=number]{width:auto;min-width:110px;padding:7px 10px;border-radius:12px;font-size:15px}
.tgl{position:relative;width:46px;height:28px;flex:none}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:.2s}
.tgl i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl input:checked+i{background:var(--sage)}
.tgl input:checked+i::after{transform:translateX(18px)}
.hm{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hm:first-of-type{border-top:0}
.hm .em{font-size:20px;width:28px;text-align:center}
.hm .nm{flex:1;min-width:0}
.hm .nm b{font-weight:550;display:block}
.hm .nm small{color:var(--muted);font-size:12px}
.hm.off .em,.hm.off .nm{opacity:.45}
.mini{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:13px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,25,20,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:2}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days7 button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 0;font-size:12px;color:var(--ink2)}
.days7 button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hero{background:linear-gradient(160deg,var(--sage-soft),var(--terra-soft));border:0}
.sr{position:absolute;left:-9999px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.fcd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase}
.fcd .b{height:44px;width:14px;border-radius:7px;background:var(--line);display:flex;align-items:flex-end;overflow:hidden}
.fcd .b i{display:block;width:100%;border-radius:7px}
.fcd .n{font-size:12px;color:var(--ink2);font-weight:600;text-transform:none}
.fcd.per .n{color:#fff;background:var(--terra);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.tip{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.card>h3+.tip{border-top:0;padding-top:2px}
.tip .i{width:22px;flex:none;text-align:center}
.tip b{color:var(--ink);font-weight:600}
details.tip summary{font-size:14px}
details.tip p{font-size:14px;color:var(--ink2)}
.bars.wide .br{grid-template-columns:132px 1fr 30px}
.pers{font-size:11.5px;color:var(--moss);margin-left:4px}
.quote{font-family:var(--serif);font-style:italic;color:var(--ink2);border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
a{color:var(--moss)}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= TEXTOS (CA / EN) ================= */
const I18N={

 today:"Avui",calendar:"Calendari",cycle:"Cicle",insights:"Estadístiques",settings:"Ajustos",
 morning:"Bon dia",afternoon:"Bona tarda",night:"Bona nit",backToday:"Tornar a avui",

 m2:{n:"Final de la regla",h:"L'FSH està elevada i recluta un grup de fol·licles a l'ovari, cadascun amb un òvul immadur. Aquests fol·licles comencen a fabricar estradiol, que encara és baix però va pujant.",b:"El sagnat minva i l'estradiol comença a regenerar l'endometri. Amb la regla has perdut ferro: els aliments rics en ferro amb vitamina C l'ajuden a recuperar.",f:"L'energia remunta a poc a poc a mesura que pugen els estrògens."},
 f1:{n:"Fase fol·licular",h:"Cap al dia 5–7 un fol·licle es fa dominant i els altres s'aturen. El dominant produeix cada cop més estradiol i inhibina B, que fan baixar l'FSH. Si els cicles són llargs o irregulars, és aquesta etapa la que s'allarga: el fol·licle triga més a madurar.",b:"L'estradiol fa créixer l'endometri (fase proliferativa), torna el flux cervical més humit, millora la sensibilitat a la insulina i afavoreix el col·lagen de la pell.",f:"Els estrògens potencien la serotonina i la dopamina: sovint hi ha més bon humor, motivació, memòria verbal i ganes de fer coses."},
 f2:{n:"Preovulació",h:"El fol·licle dominant fa uns 18–24 mm. Quan l'estradiol es manté alt unes 36–50 hores, canvia el seu efecte sobre l'hipotàlem i la hipòfisi (retroalimentació positiva) i dispara el pic de LH. La testosterona també puja una mica.",b:"El coll de l'úter es torna més tou i obert, i el flux és transparent i elàstic, com clara d'ou: permet que els espermatozoides hi sobrevisquin fins a 5 dies. És la finestra fèrtil.",f:"Sovint és el moment de màxima energia, sociabilitat i libido."},

/* ================= UTILITATS ================= */
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const kdate=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12);};
const dn=k=>{const[y,m,d]=k.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const nk=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());};
const add=(k,n)=>nk(dn(k)+n);
const TODAY=()=>dkey(new Date());
const dow=k=>((dn(k)+3)%7+7)%7;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const loc=()=>S.lang==="en"?"en-GB":"ca-ES";
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const fmt=(k,o)=>new Intl.DateTimeFormat(loc(),o).format(kdate(k));
const fmtShort=k=>fmt(k,{day:"numeric",month:"short"});
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r1=x=>Math.round(x*10)/10;
function t(k,...a){const L=I18N[S.lang]||I18N.ca;let v=L[k];if(v===undefined)v=I18N.ca[k];if(v===undefined)return k;return typeof v==="function"?v(...a):v;}
const L=()=>I18N[S.lang]||I18N.ca;

const KEY="arrel-v1";
function fresh(){
  const td=TODAY();
  return {v:1,lang:(navigator.language||"").toLowerCase().startsWith("en")?"en":"ca",theme:"auto",name:"",created:td,onboarded:false,
    habits:DEF_HABITS.map(h=>Object.assign({days:[1,1,1,1,1,1,1],since:td},JSON.parse(JSON.stringify(h)))),
    days:{},feelCustom:[],cycle:{len:28,plen:5,fertile:true,temp:false,mucus:true,lh:true},lastBackupN:dn(td)};
}
let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1){S=o;}}}catch(e){}migrate();}
function migrate(){const td=TODAY();let ch=false;if(S.cycle&&S.cycle.lh===undefined){S.cycle.lh=true;ch=true;}if(!Array.isArray(S.feelCustom)){S.feelCustom=[];ch=true;}
  DEF_HABITS.forEach(d=>{const x=S.habits.find(h=>h.id===d.id);
    if(!x){S.habits.push(Object.assign({days:[1,1,1,1,1,1,1],since:td},JSON.parse(JSON.stringify(d))));ch=true;}
    else if(d.id==="journal"&&!x.freq&&!x.active&&!x.name&&!Object.values(S.days).some(v=>v.h&&v.h.journal)){Object.assign(x,{freq:"week",per:1,active:true,since:td});ch=true;}});
  if(ch)save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function day(k){return S.days[k]||{};}
function ensure(k){return S.days[k]||(S.days[k]={});}
function clean(k){const d=S.days[k];if(!d)return;if(d.h&&!Object.keys(d.h).length)delete d.h;["feel","sym"].forEach(f=>{if(d[f]&&!d[f].length)delete d[f];});
  Object.keys(d).forEach(f=>{if(d[f]===null||d[f]===""||d[f]===undefined)delete d[f];});if(!Object.keys(d).length)delete S.days[k];}
function applyTheme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);r.lang=S.lang;}
let toastT;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1400);}

/* ================= HÀBITS ================= */
const hname=h=>h.key&&!h.name?(L().h[h.key]||h.key):h.name;
const hunit=h=>h.ukey?(L().u[h.ukey]||""):(h.unit||"");
const isDaily=h=>!h.freq||h.freq==="day";
const sched=(h,k)=>isDaily(h)&&h.active&&h.days[dow(k)]&&k>=(h.since||S.created);
const shownOn=(h,k)=>isDaily(h)?sched(h,k):(h.active&&k>=(h.since||S.created));
function pStart(h,k){return h.freq==="week"?add(k,-dow(k)):k.slice(0,8)+"01";}
function pNext(h,s){if(h.freq==="week")return add(s,7);let[y,m]=s.split("-").map(Number);m++;if(m>12){m=1;y++;}return y+"-"+pad(m)+"-01";}
function pPrev(h,s){if(h.freq==="week")return add(s,-7);let[y,m]=s.split("-").map(Number);m--;if(m<1){m=12;y--;}return y+"-"+pad(m)+"-01";}
function pCount(h,s){const e=pNext(h,s);let n=0;for(let k=s;k<e;k=add(k,1))if(isDone(h,k))n++;return n;}
const pMet=(h,s)=>pCount(h,s)>=(h.per||1);
function pStreak(h){let s=pStart(h,TODAY());if(!pMet(h,s))s=pPrev(h,s);const lo=pStart(h,h.since||S.created);let n=0,g=0;while(g++<600&&s>=lo&&pMet(h,s)){n++;s=pPrev(h,s);}return n;}
function pBest(h){let s=pStart(h,h.since||S.created),b=0,c=0,g=0;const end=pStart(h,TODAY());while(g++<600&&s<=end){if(pMet(h,s)){c++;b=Math.max(b,c);}else if(s<end)c=0;s=pNext(h,s);}return b;}
const streakTxt=(h,n)=>h.freq==="week"?t("streakW",n):h.freq==="month"?t("streakM",n):t("streak",n);
function isDone(h,k){const v=((day(k).h)||{})[h.id]||0;return h.type==="count"?v>=(h.target||1):v>=1;}
function streak(h){if(!isDaily(h))return pStreak(h);let k=TODAY();if(!isDone(h,k))k=add(k,-1);let n=0,guard=0;
  while(guard++<2000&&k>=(h.since||S.created)){if(h.days[dow(k)]){if(isDone(h,k))n++;else break;}k=add(k,-1);}return n;}
function bestStreak(h){if(!isDaily(h))return pBest(h);let best=0,cur=0;const st=h.since||S.created;for(let k=st;k<=TODAY();k=add(k,1)){if(!h.days[dow(k)])continue;if(isDone(h,k)){cur++;best=Math.max(best,cur);}else if(k<TODAY())cur=0;}return best;}
function dayHabits(k){const hs=S.habits.filter(h=>sched(h,k));return {n:hs.length,done:hs.filter(h=>isDone(h,k)).length};}

/* ================= CICLE ================= */
function periods(){
  const ds=Object.keys(S.days).filter(k=>(S.days[k].flow||0)>=2).sort();const out=[];
  for(const k of ds){const l=out[out.length-1];if(l&&dn(k)-dn(l.end)<=2){l.end=k;l.n=dn(k)-dn(l.start)+1;}else out.push({start:k,end:k,n:1});}
  return out;
}
let _cs=null,_csKey="";
function cstats(){
  const sig=JSON.stringify(S.cycle)+"|"+TODAY()+"|"+Object.keys(S.days).filter(k=>S.days[k].flow||S.days[k].temp||S.days[k].lh).map(k=>k+(S.days[k].flow||"")+(S.days[k].temp||"")+(S.days[k].lh||"")).join(",");
  if(_cs&&_csKey===sig)return _cs;
  const P=periods();const lens=[];
  for(let i=1;i<P.length;i++){const l=dn(P[i].start)-dn(P[i-1].start);if(l>=15&&l<=90)lens.push(l);}
  const rl=lens.slice(-6);const avg=rl.length?Math.round(mean(rl)):S.cycle.len;
  const pl=P.filter((p,i)=>i<P.length-1||dn(TODAY())-dn(p.end)>2).slice(-6).map(p=>p.n);
  const plen=pl.length?Math.round(mean(pl)):S.cycle.plen;
  let sd=null;if(rl.length>=2){const m=mean(rl);sd=Math.sqrt(mean(rl.map(x=>(x-m)*(x-m))));}
  const mn=rl.length?Math.min(...rl):null,mx=rl.length?Math.max(...rl):null;
  const irregular=rl.length>=3&&(mx-mn)>=8;
  _cs={P,lens,rl,avg,plen,sd,mn,mx,irregular,ov:{}};_csKey=sig;return _cs;
}
/* Ovulació d'un cicle: test LH positiu > canvi de temperatura (regla 3 sobre 6) > 14 dies abans de la regla següent > estimació */
function cycleOv(i){
  const st=cstats();if(st.ov[i])return st.ov[i];const P=st.P;const p=P[i],nx=P[i+1];
  const end=nx?add(nx.start,-1):TODAY();let r=null;
  for(let k=add(p.start,5);k<=end&&!r;k=add(k,1)){if(day(k).lh==="pos")r={ov:add(k,1),src:"lh"};}
  if(!r){const tp=[];for(let k=p.start;k<=end;k=add(k,1)){const v=day(k).temp;if(v)tp.push({k,v});}
    for(let j=6;j+2<tp.length&&!r;j++){const base=Math.max(...tp.slice(j-6,j).map(x=>x.v));if(tp[j].v>base&&tp[j+1].v>base&&tp[j+2].v>=base+0.2)r={ov:add(tp[j].k,-1),src:"temp"};}}
  if(!r&&nx)r={ov:add(nx.start,-14),src:"next"};
  if(!r)r={ov:add(p.start,Math.max(st.avg-14,8)),src:"est"};
  st.ov[i]=r;return r;
}
function phaseFor(dayN,ovDay,plen){if(dayN<=plen)return "men";if(dayN<ovDay-1)return "fol";if(dayN<=ovDay+1)return "ovu";return "lut";}
function subPhase(dayN,ovDay,plen){
  if(dayN<=2)return "m1";if(dayN<=plen)return "m2";if(dayN<ovDay-3)return "f1";if(dayN<ovDay)return "f2";if(dayN===ovDay)return "ov";
  if(dayN<=ovDay+4)return "l1";if(dayN<=ovDay+9)return "l2";return "l3";
}
function cycleAt(k){
  const st=cstats();const P=st.P;let i=-1;for(let j=0;j<P.length;j++){if(P[j].start<=k)i=j;else break;}
  if(i<0)return null;const p=P[i];const nxt=P[i+1];
  const len=nxt?dn(nxt.start)-dn(p.start):st.avg;const dayN=dn(k)-dn(p.start)+1;
  if(!nxt&&dayN>Math.max(st.avg,st.mx||0)+45)return null;
  const o=cycleOv(i);let ovDay=dn(o.ov)-dn(p.start)+1;if(ovDay<=p.n+1)ovDay=p.n+2;
  const plen=Math.max(p.n,1);
  return {i,start:p.start,dayN,len,plen,ovDay,ov:o.ov,ovSrc:o.src,phase:phaseFor(dayN,ovDay,plen),sub:subPhase(dayN,ovDay,plen),closed:!!nxt,
    late:!nxt&&dayN>(st.irregular?st.mx:st.avg)?dayN-(st.irregular?st.mx:st.avg):0};
}
function predictions(){
  const st=cstats();const P=st.P;if(!P.length)return null;const last=P[P.length-1];const today=TODAY();
  let next=add(last.start,st.avg);if(next<=today&&cycleAt(today))next=add(today,1);
  let lo=null,hi=null;
  if(st.irregular){const s=Math.max(st.sd||0,4);lo=add(last.start,Math.round(st.avg-s));hi=add(last.start,Math.round(st.avg+s));if(lo<=today)lo=add(today,1);if(hi<lo)hi=add(lo,4);if(next<lo)next=lo;if(next>hi)next=hi;}
  const list=[];for(let i=0;i<(st.irregular?1:6);i++)list.push(add(next,i*st.avg));
  const ci=cycleAt(today);let ovu=add(next,-14);
  // si l'ovulació del cicle actual ja s'ha detectat, la propera regla s'estima 14 dies després
  if(ci&&!ci.closed&&(ci.ovSrc==="lh"||ci.ovSrc==="temp")){const n2=add(ci.ov,14);if(n2>today){next=n2;lo=hi=null;list[0]=n2;}ovu=null;}
  return {next,list,lo,hi,irregular:st.irregular,ovu,fertFrom:ovu?add(ovu,-5):null,fertTo:ovu?add(ovu,1):null};
}
function calMarks(fromK,toK){
  const st=cstats();const P=st.P;const m={};const set=(k,f)=>{if(k<fromK||k>toK)return;(m[k]=m[k]||{})[f]=true;};
  const today=TODAY();
  if(S.cycle.fertile)for(let i=0;i<P.length;i++){const o=cycleOv(i);if(o.src==="est"&&st.irregular)continue;if(o.src==="est"&&o.ov<=today&&!P[i+1]){}
    const len=P[i+1]?dn(P[i+1].start)-dn(P[i].start):st.avg;if(len<20&&o.src!=="lh"&&o.src!=="temp")continue;
    for(let d=-5;d<=1;d++)set(add(o.ov,d),"fert");set(o.ov,"ovu");}
  const pr=predictions();
  if(pr){
    if(pr.lo&&pr.hi){for(let k=pr.lo;k<=pr.hi;k=add(k,1))if(k>today)set(k,"win");set(pr.next,"pred");}
    else pr.list.forEach((s,ci)=>{for(let d=0;d<st.plen;d++){const k=add(s,d);if(k>today)set(k,"pred");}
      if(S.cycle.fertile&&ci>0&&!st.irregular){const ov=add(s,-14);for(let d=-5;d<=1;d++){const k=add(ov,d);if(k>today)set(k,"fert");}if(ov>today)set(ov,"ovu");}});
    if(S.cycle.fertile&&pr.ovu&&!st.irregular){for(let d=-5;d<=1;d++){const k=add(pr.ovu,d);if(k>today)set(k,"fert");}if(pr.ovu>today)set(pr.ovu,"ovu");}
  }
  return m;
}

/* ================= PERFIL PERSONAL (les teves dades per etapa) ================= */
let _pf=null,_pfKey="";
function profile(){
  const td=TODAY();const sig=td+"|"+JSON.stringify(S.days).length+"|"+cstats().P.length;if(_pf&&_pfKey===sig)return _pf;
  const subs={};SUBORD.forEach(s=>subs[s]={n:0,m:[],e:[],sl:[],sym:{},feel:{},notes:[]});const all={m:[],e:[],sl:[]};
  Object.keys(S.days).forEach(k=>{if(k>td)return;const ci=cycleAt(k);const d=S.days[k];
    if(d.mood)all.m.push(d.mood);if(d.energy)all.e.push(d.energy);if(d.sleep!=null)all.sl.push(d.sleep);
    if(!ci)return;const b=subs[ci.sub];b.n++;if(d.mood)b.m.push(d.mood);if(d.energy)b.e.push(d.energy);if(d.sleep!=null)b.sl.push(d.sleep);
    (d.sym||[]).forEach(s=>b.sym[s]=(b.sym[s]||0)+1);(d.feel||[]).forEach(f=>b.feel[f]=(b.feel[f]||0)+1);
    const tx=(d.feelTxt||d.note||"").trim();if(tx)b.notes.push({k,i:ci.i,dayN:ci.dayN,tx});});
  _pf={subs,om:mean(all.m),oe:mean(all.e),os:mean(all.sl)};_pfKey=sig;return _pf;
}
/* Previsió per a una etapa: ciència + les teves dades (com més dies registris, més pes tenen les teves) */
function forecast(sp){
  const pf=profile(),b=pf.subs[sp],base=SUBPROF[sp];const cl=x=>Math.max(1,Math.min(5,x));
  const bl=(arr,baseV,overall)=>{const bAdj=cl((overall||3.3)+(baseV-3.4)*0.8);if(!arr.length)return {v:bAdj,n:0};const w=arr.length/(arr.length+4);return {v:cl(w*mean(arr)+(1-w)*bAdj),n:arr.length};};
  const E=bl(b.e,base.e,pf.oe),M=bl(b.m,base.m,pf.om);
  const sym=Object.entries(b.sym).filter(([s,c])=>c>=2&&c/Math.max(b.n,1)>=0.3).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([s,c])=>({s,p:Math.round(c*100/b.n)}));
  const feel=Object.entries(b.feel).filter(([f,c])=>c>=2).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([f])=>f);
  const slMine=b.sl.length>=3?mean(b.sl):null;
  const moreSleep=E.v<2.5||(slMine!=null&&pf.os!=null&&slMine<pf.os-0.5);
  return {e:E.v,eN:E.n,m:M.v,mN:M.n,n:b.n,sym,feel,slMine,moreSleep};
}
/* Posició al cicle de qualsevol dia, també futur */
function posAt(k){
  const td=TODAY();if(k<=td){const ci=cycleAt(k);return ci?{dayN:ci.dayN,sub:ci.sub,est:ci.ovSrc==="est"}:null;}
  const ci=cycleAt(td);if(!ci)return null;const pr=predictions();const st=cstats();
  let dayN=ci.dayN+dn(k)-dn(td),ovDay=ci.ovDay,plen=ci.plen,est=ci.ovSrc==="est";
  if(pr&&k>=pr.next){dayN=dn(k)-dn(pr.next)+1;plen=st.plen;ovDay=Math.max(st.avg-14,plen+2);est=true;}
  return {dayN,sub:subPhase(dayN,ovDay,plen),est,period:pr&&k>=pr.next&&dayN<=plen};
}
const eCol=e=>e<2.5?"var(--terra)":e<3.5?"var(--sand)":"var(--sage)";

const moodTxt=v=>L().moodL[Math.max(0,Math.min(4,Math.round(v)-1))];
function lastNote(sp,ci){const b=profile().subs[sp];const prev=b.notes.filter(x=>x.i<ci.i);if(!prev.length)return null;
  const li=Math.max(...prev.map(x=>x.i));const same=prev.filter(x=>x.i===li);same.sort((a,c)=>Math.abs(a.dayN-ci.dayN)-Math.abs(c.dayN-ci.dayN));return same[0];}

/* Targeta «Avui el teu cos» + previsió de 7 dies */
function bodyCard(k){
  const ci=cycleAt(k);if(!ci)return "";const sp=ci.sub,g=G(sp),fc=forecast(sp),st=cstats();
  const pers=n=>n>=3?'<span class="pers">· '+t("fromYou")+'</span>':'';
  let h='<div class="card"><h3>'+t("bodyToday")+'<span class="muted">'+subName(sp)+'</span></h3>';
  h+='<div class="tip"><span class="i">⚡</span><div><b>'+t("energy")+': '+lvlTxt(fc.e).toLowerCase()+'</b> · '+t("mood")+': '+moodTxt(fc.m).toLowerCase()+pers(Math.max(fc.eN,fc.mN))+'</div></div>';
  h+='<div class="tip"><span class="i">😴</span><div>'+(fc.moreSleep?'<b>'+t("sleepMore")+'.</b> ':'')+esc(g.rest)+(fc.slMine!=null?' <span class="muted">'+t("youSleep",String(r1(fc.slMine)).replace(".",","))+'</span>':'')+'</div></div>';
  h+='<div class="tip"><span class="i">🎯</span><div><b>'+t("bestFor")+':</b> '+esc(g.best)+'</div></div>';
  if(fc.sym.length)h+='<div class="tip"><span class="i">⚠️</span><div><b>'+t("likelySym")+':</b> '+fc.sym.map(x=>L().symL[x.s].toLowerCase()+' ('+x.p+'%)').join(", ")+'</div></div>';
  h+='<details class="tip" style="display:block"><summary>🥗 '+t("foodL")+' · 🏃 '+t("moveL")+'</summary><p style="margin:8px 0 4px">'+esc(g.food)+'</p><p style="margin:4px 0">'+esc(g.move)+'</p></details>';
  const ln=lastNote(sp,ci);if(ln)h+='<div class="tip"><span class="i">📝</span><div><span class="muted">'+t("lastTime")+' ('+fmtShort(ln.k)+'):</span><div class="quote">'+esc(ln.tx.length>160?ln.tx.slice(0,157)+"…":ln.tx)+'</div></div></div>';
  // propers 7 dies
  const days=[];for(let i=0;i<7;i++){const dk=add(k,i);const p=posAt(dk);if(!p)continue;const f=forecast(p.sub);days.push({dk,p,f});}
  if(days.length){
    h+='<div class="lbl" style="margin-top:12px">'+t("next7")+'</div><div class="fc">'+days.map(x=>'<div class="fcd'+(x.p.period||(x.dk<=TODAY()&&(day(x.dk).flow||0)>=2)?' per':'')+'"><span>'+L().wd[dow(x.dk)]+'</span><span class="b"><i style="height:'+Math.round(x.f.e*20)+'%;background:'+eCol(x.f.e)+'"></i></span><span class="n">'+kdate(x.dk).getDate()+'</span></div>').join("")+'</div>';
    const low=days.slice(1).filter(x=>x.f.e<2.5);
    if(low.length)h+='<div class="note" style="color:var(--ink2)">'+t("lowAhead",low.map(x=>cap(fmt(x.dk,{weekday:"short"}))).join(", "))+'</div>';
  }
  if(ci.ovSrc==="est"&&st.irregular)h+='<div class="muted" style="margin-top:8px">'+t("confLow")+'</div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn ghost sm" style="padding-left:0" onclick="go(\'cycle\')">'+t("moreCycle")+' ›</button></div></div>';
  return h;
}

function hormoneCard(ci){
  const st=cstats();const len=cycLen(ci);const ovD=ci?ci.ovDay:Math.max(len-13,8);
  const to28=d=>d<=ovD?d*(14.8/ovD):14.8+(d-ovD)*(13.2/Math.max(1,len-ovD));
  const g=(x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
  const H={E:x=>0.18+0.72*g(x,13.8,2.2)+0.33*g(x,22,3.6),P:x=>0.05+0.85*g(x,22.5,3.4),LH:x=>0.07+0.9*g(x,14.8,0.9),FSH:x=>0.16+0.18*g(x,3,3)+0.36*g(x,14.8,1)};
  const col={E:"var(--terra)",P:"var(--sage)",LH:"var(--sand)",FSH:"var(--plum)"};
  const nm={E:S.lang==="en"?"Oestrogen":"Estrògens",P:S.lang==="en"?"Progesterone":"Progesterona",LH:"LH",FSH:"FSH"};
  const W=320,Ht=150,pl=8,pr=8,pt=12,pb=22,iw=W-pl-pr,ih=Ht-pt-pb;
  const X=d=>pl+(d-1)/(len-1)*iw,Y=v=>pt+ih-v*ih;
  let s='<svg viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="'+t("hormonesChart")+'">';
  const pls=ci?ci.plen:st.plen;
  [["men",1,pls],["fol",pls,ovD-1],["ovu",ovD-1,ovD+1],["lut",ovD+1,len]].forEach(([p,a,b])=>{s+='<rect x="'+X(a)+'" y="'+(Ht-pb+6)+'" width="'+Math.max(0,X(b)-X(a))+'" height="4" rx="2" fill="'+PHCOL[p]+'" opacity=".8"/>';});
  Object.keys(H).forEach(k=>{let d="";for(let i=0;i<=100;i++){const dd=1+i*(len-1)/100;d+=(i?"L":"M")+X(dd).toFixed(1)+" "+Y(H[k](to28(dd))).toFixed(1);}s+='<path d="'+d+'" fill="none" stroke="'+col[k]+'" stroke-width="2" stroke-linejoin="round"/>';});
  if(ci){const x=X(Math.min(ci.dayN,len));s+='<line x1="'+x+'" x2="'+x+'" y1="'+pt+'" y2="'+(Ht-pb)+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><text x="'+x+'" y="'+(pt-2)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+(S.lang==="en"?"today":"avui")+'</text>';}
  s+='<text x="'+X(1)+'" y="'+(Ht-2)+'">1</text><text x="'+X(ovD)+'" y="'+(Ht-2)+'" text-anchor="middle">'+ovD+'</text><text x="'+X(len)+'" y="'+(Ht-2)+'" text-anchor="end">'+len+'</text></svg>';
  return '<div class="card chart"><h3>'+t("hormonesChart")+'</h3>'+s+'<div class="legend">'+Object.keys(H).map(k=>'<span><i class="sw" style="background:'+col[k]+';height:3px;width:14px;border-radius:2px"></i>'+nm[k]+'</span>').join("")+'</div><div class="note">'+t("schematic")+'</div></div>';
}
function tempCard(ci){

  s+='<path d="'+pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")+'" fill="none" stroke="var(--terra)" stroke-width="2"/>'+pts.map(p=>'<circle cx="'+X(p.d)+'" cy="'+Y(p.v)+'" r="3.5" fill="var(--terra)"><title>'+t("day")+' '+p.d+': '+p.v+'</title></circle>').join("");

  h+='<div class="card"><h3>'+t("manageHabits")+'<button class="btn sm" onclick="SHEET={type:\'habit\',id:null};render()">+ '+t("addHabit")+'</button></h3>'+
    S.habits.map((x,i)=>'<div class="hm'+(x.active?'':' off')+'"><span class="em">'+esc(x.emoji)+'</span><div class="nm" onclick="SHEET={type:\'habit\',id:\''+x.id+'\'};render()" style="cursor:pointer"><b>'+esc(hname(x))+'</b><small>'+(x.freq==="week"?t("perW",x.per||1):x.freq==="month"?t("perM",x.per||1):(x.type==="count"?x.target+' '+esc(hunit(x))+' · ':'')+daysTxt(x.days))+'</small></div>'+
      '<button class="mini" onclick="moveH('+i+',-1)" '+(i===0?'disabled style="opacity:.3"':'')+'>↑</button><button class="mini" onclick="moveH('+i+',1)" '+(i===S.habits.length-1?'disabled style="opacity:.3"':'')+'>↓</button>'+
      '<label class="tgl"><input type="checkbox" '+(x.active?'checked':'')+' onchange="toggleH(\''+x.id+'\',this.checked)"><i></i></label></div>').join("")+'</div>';
  h+='<div class="card"><h3>'+t("myFeel")+'</h3>'+((S.feelCustom||[]).length?'<div class="chips">'+S.feelCustom.map(c=>'<span class="chip">'+esc(c.name)+'<button class="mini" style="width:22px;height:22px;font-size:11px;margin-right:-6px" onclick="delFeel(\''+c.id+'\')" aria-label="'+t("del")+'">✕</button></span>').join("")+'</div>':'<p class="muted" style="margin:0">'+t("noCustom")+'</p>')+'</div>';
  h+='<div class="card"><h3>'+t("cycleSettings")+'</h3>'+
    '<div class="set"><span>'+t("typLen")+'</span><input type="number" min="18" max="50" value="'+S.cycle.len+'" onchange="setCyc(\'len\',this.value,18,50)"></div>'+
    '<div class="set"><span>'+t("typPlen")+'</span><input type="number" min="1" max="12" value="'+S.cycle.plen+'" onchange="setCyc(\'plen\',this.value,1,12)"></div>'+
    [["fertile","showFert"],["mucus","trackMucus"],["lh","trackLH"],["temp","trackTemp"]].map(([k,l])=>'<div class="set"><span>'+t(l)+'</span><label class="tgl"><input type="checkbox" '+(S.cycle[k]?'checked':'')+' onchange="S.cycle.'+k+'=this.checked;changed()"><i></i></label></div>').join("")+'</div>';
  h+='<div class="card"><h3>'+t("data")+'</h3><p class="sub" style="margin:0 0 12px">'+t("privacy")+'</p><div class="muted" style="margin-bottom:10px">'+t("lastBackup")+': '+(S.lastBackup||t("never"))+'</div>'+
    '<div class="row"><button class="btn pri" onclick="shareBackup(this)">'+t("backup")+'</button><button class="btn" onclick="copyBackup(this)">'+t("copyText")+'</button><button class="btn" onclick="UI.imp=!UI.imp;render()">'+t("import")+'</button></div>'+
    (UI.imp?'<div style="margin-top:12px"><label class="btn sm" style="margin-bottom:8px">'+t("chooseFile")+'<input type="file" accept=".json,application/json,text/plain" class="sr" onchange="importFile(this)"></label><textarea id="impt" rows="3" placeholder="'+t("importPh")+'"></textarea><div class="row" style="margin-top:8px"><button class="btn pri sm" onclick="importText(document.getElementById(\'impt\').value)">'+t("importBtn")+'</button><span id="impm" class="muted"></span></div></div>':'')+
    '<div style="margin-top:16px">'+(UI.reset?'<div class="note" style="color:var(--ink)">'+t("resetSure")+'<div class="row" style="margin-top:8px"><button class="btn danger sm" onclick="doReset()">'+t("resetYes")+'</button><button class="btn sm" onclick="UI.reset=false;render()">'+t("cancel")+'</button></div></div>':'<button class="btn ghost sm" style="color:var(--terra);padding-left:0" onclick="UI.reset=true;render()">'+t("reset")+'</button>')+'</div></div>';
  h+='<p class="muted" style="text-align:center;margin-top:18px">Arrel · '+(S.lang==="en"?"habits, mood & cycle":"hàbits, ànim i cicle")+'</p>';
  return h;
}
function daysTxt(d){if(d.every(Boolean))return S.lang==="en"?"every day":"cada dia";return d.map((v,i)=>v?L().wd[i]:null).filter(Boolean).join(" ");}
function moveH(i,dir){const j=i+dir;if(j<0||j>=S.habits.length)return;const a=S.habits;[a[i],a[j]]=[a[j],a[i]];changed();}
function toggleH(id,on){const x=S.habits.find(h=>h.id===id);if(!x)return;x.active=on;if(on&&!x.since)x.since=TODAY();if(on&&x.since>TODAY())x.since=TODAY();changed();}
function setCyc(k,v,lo,hi){const n=parseInt(v,10);if(n>=lo&&n<=hi)S.cycle[k]=n;changed();}
let HF=null;
function habitSheet(){
  const ex=SHEET.id?S.habits.find(h=>h.id===SHEET.id):null;
  if(!HF||HF._for!==SHEET.id){HF=ex?{_for:SHEET.id,name:hname(ex),emoji:ex.emoji,type:ex.type,target:ex.target||8,unit:hunit(ex),days:ex.days.slice(),link:ex.link||"",freq:ex.freq||"day",per:ex.per||1}:{_for:null,name:"",emoji:"🌱",type:"check",target:8,unit:"",days:[1,1,1,1,1,1,1],link:"",freq:"day",per:1};}
  const f=HF;
  let b='<div class="card"><div class="row" style="flex-wrap:nowrap"><input type="text" style="width:64px;text-align:center;font-size:22px;padding:8px" maxlength="4" value="'+esc(f.emoji)+'" oninput="HF.emoji=this.value" aria-label="'+t("emoji")+'"><input type="text" placeholder="'+t("habitName")+'" value="'+esc(f.name)+'" oninput="HF.name=this.value"></div>'+
    '<div class="lbl">'+t("freq")+'</div><div class="seg">'+[["day","fDay"],["week","fWeek"],["month","fMonth"]].map(([v,l])=>'<button class="'+(f.freq===v?"on":"")+'" onclick="HF.freq=\''+v+'\';renderSheet()">'+t(l)+'</button>').join("")+'</div>'+
    (f.freq!=="day"?'<div class="lbl">'+(f.freq==="week"?t("timesWeek"):t("timesMonth"))+'</div><div class="stepper"><button onclick="HF.per=Math.max(1,HF.per-1);renderSheet()">−</button><b>'+f.per+'</b><button onclick="HF.per=Math.min('+(f.freq==="week"?7:31)+',HF.per+1);renderSheet()">+</button></div>':'')+
    (f.freq==="day"?'<div class="lbl">'+t("type")+'</div><div class="seg"><button class="'+(f.type==="check"?"on":"")+'" onclick="HF.type=\'check\';renderSheet()">'+t("tCheck")+'</button><button class="'+(f.type==="count"?"on":"")+'" onclick="HF.type=\'count\';renderSheet()">'+t("tCount")+'</button></div>':'')+
    (f.type==="count"&&f.freq==="day"?'<div class="row" style="margin-top:10px;flex-wrap:nowrap"><label style="flex:1"><div class="muted">'+t("target")+'</div><input type="number" min="1" max="999" value="'+f.target+'" oninput="HF.target=parseInt(this.value,10)||1"></label><label style="flex:1"><div class="muted">'+t("unit")+'</div><input type="text" value="'+esc(f.unit)+'" oninput="HF.unit=this.value"></label></div>':'')+
    (f.freq==="day"?'<div class="lbl">'+t("whichDays")+'</div><div class="days7">'+L().wd.map((w,i)=>'<button class="'+(f.days[i]?'on':'')+'" onclick="HF.days['+i+']=HF.days['+i+']?0:1;renderSheet()">'+w+'</button>').join("")+'</div>':'')+
    '<div class="lbl">'+t("link")+'</div><input type="url" placeholder="https://" value="'+esc(f.link)+'" oninput="HF.link=this.value"></div>'+
    '<div class="row"><button class="btn pri" onclick="saveHabit()">'+t("save")+'</button><button class="btn" onclick="closeSheet()">'+t("cancel")+'</button>'+(ex?(UI.delH?'<span style="flex-basis:100%"></span><div class="note" style="flex:1;color:var(--ink)">'+t("delSure")+'<div class="row" style="margin-top:8px"><button class="btn danger sm" onclick="delHabit()">'+t("yes")+'</button><button class="btn sm" onclick="UI.delH=false;renderSheet()">'+t("cancel")+'</button></div></div>':'<button class="btn ghost" style="color:var(--terra);margin-left:auto" onclick="UI.delH=true;renderSheet()">'+t("del")+'</button>'):'')+'</div>';
  return {title:ex?t("editHabit"):t("newHabit"),body:b};
}
function saveHabit(){
  const f=HF;const nm=(f.name||"").trim();if(!nm){toast(t("habitName")+"?");return;}if(!f.days.some(Boolean))f.days=[1,1,1,1,1,1,1];
  let x=SHEET.id?S.habits.find(h=>h.id===SHEET.id):null;
  if(!x){x={id:"h"+Date.now().toString(36),active:true,since:TODAY()};S.habits.push(x);}
  if(!(x.key&&nm===hname(x))){x.name=nm;}
  x.emoji=(f.emoji||"•").trim()||"•";x.type=f.type;if(f.type==="count"){x.target=Math.max(1,f.target||1);if(!(x.ukey&&f.unit===hunit(x))){x.unit=f.unit;delete x.ukey;}}
  x.days=f.days.slice();x.freq=f.freq;if(f.freq!=="day"){x.type="check";x.per=Math.max(1,f.per||1);}else delete x.per;x.link=(f.link||"").trim();if(!x.link)delete x.link;
  HF=null;UI.delH=false;SHEET=null;changed();toast(t("saved"));
}
function delHabit(){const id=SHEET.id;S.habits=S.habits.filter(h=>h.id!==id);Object.values(S.days).forEach(d=>{if(d.h)delete d.h[id];});Object.keys(S.days).forEach(clean);HF=null;UI.delH=false;SHEET=null;changed();}
function markBackup(){S.lastBackup=new Date().toLocaleDateString(loc());S.lastBackupN=dn(TODAY());save();}
function copyBackup(btn){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>{btn.textContent=t("copied");markBackup();},()=>{btn.textContent="✗";});}
async function shareBackup(btn){
  const name="arrel-copia-"+TODAY()+".json";const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Arrel"});markBackup();render();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();render();
}
function importText(txt){try{const o=JSON.parse(txt);
  if(o&&o.arrel==="merge"){(o.periods||[]).forEach(([a,b])=>setFlowRange(a,b));
    (o.habits||[]).forEach(x=>{if(!S.habits.find(h=>h.id===x.id))S.habits.push(Object.assign({days:[1,1,1,1,1,1,1],since:TODAY(),active:true},x));});
    if(o.cycle)Object.assign(S.cycle,o.cycle);S.onboarded=true;save();UI.imp=false;toast(t("added"));go("cycle");return;}
  if(!o||o.v!==1||!o.days||!o.habits)throw 0;S=o;S.onboarded=true;if(!S.lastBackupN)S.lastBackupN=dn(TODAY());_cs=null;_pf=null;migrate();save();UI.imp=false;toast(t("imported"));go("today");}catch(e){const m=document.getElementById("impm");if(m)m.textContent=t("badImport");else toast(t("badImport"));}}
function importFile(inp){const f=inp.files&&inp.files[0];if(f)f.text().then(importText);}
function doReset(){S=fresh();UI={};save();go("today");}

/* ================= INICI ================= */
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SHEET)closeSheet();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!SHEET){if(route==="today"&&EDIT<TODAY()&&!UI.keptPast)EDIT=TODAY();render();}});
load();render();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!/claudeusercontent|claude\.ai/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
